name: build-flux-worker

# Builds the Flux + LoRA serverless image and pushes it to GHCR.
# Triggers on push to main (e.g. after swapping a LoRA) and manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # checkout (incl. LFS)
      packages: write     # push to ghcr.io
    steps:
      # Default runner has ~14 GB free; the 17 GB Flux layer needs more headroom.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.0.0
        with:
          tool-cache: true
          large-packages: true
          docker-images: true

      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image names must be lowercase; owner login may contain capitals.
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          # Registry cache keeps the heavy Flux layer between runs so LoRA-only
          # changes don't re-download 17 GB.
          cache-from: type=registry,ref=${{ steps.img.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.img.outputs.name }}:buildcache,mode=max
