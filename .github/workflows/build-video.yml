name: build-video-worker

on:
  push:
    branches: [main]
    paths:
      - "video-worker/**"
      - ".github/workflows/build-video.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache
          sudo docker image prune -af || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: video-worker
          file: video-worker/Dockerfile-video
          push: true
          tags: |
            ghcr.io/cashdame/neirodevki-video:latest
            ghcr.io/cashdame/neirodevki-video:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test imports
        run: docker run --rm ghcr.io/cashdame/neirodevki-video:${{ github.sha }}
